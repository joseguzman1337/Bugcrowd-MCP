[project]
name = "bugcrowd-mcp"
version = "0.1.0"
description = "Bugcrowd MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "FastMCP>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "black>=24.0.0",
]
